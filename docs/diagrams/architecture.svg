<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L12,6 L0,11 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1080" height="540" rx="8" fill="#ffffff"/>

  <!-- Application boundary. -->
  <rect x="180" y="120" width="720" height="270" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="146" font-size="14" font-weight="600" fill="#334155">NestJS application (stateless)</text>

  <!-- Connections. -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M540,80 V180"/>                       <!-- client -> pipeline -->
    <path d="M540,236 V262 H300 V300"/>            <!-- pipeline -> appointments -->
    <path d="M540,262 V300"/>                      <!-- pipeline -> availability -->
    <path d="M540,262 H780 V300"/>                 <!-- pipeline -> health -->
    <path d="M300,356 V444"/>                      <!-- appointments -> database -->
    <path d="M540,356 V444"/>                      <!-- availability -> database -->
  </g>
  <path d="M780,356 V444" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Connection labels. -->
  <g font-size="12" fill="#64748b">
    <text x="548" y="104">REST</text>
    <text x="308" y="410">transaction</text>
    <text x="548" y="410">one query per day</text>
    <text x="788" y="410">readiness ping</text>
  </g>

  <!-- Client. -->
  <rect x="400" y="24" width="280" height="56" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="540" y="48" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">Client</text>
  <text x="540" y="67" font-size="12" fill="#4338ca" text-anchor="middle">cURL · Scalar UI · test harness</text>

  <!-- Request pipeline. -->
  <rect x="380" y="180" width="320" height="56" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="540" y="204" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">Request pipeline</text>
  <text x="540" y="223" font-size="12" fill="#4338ca" text-anchor="middle">logging · validation · error mapping</text>

  <!-- Feature modules. -->
  <g fill="#ecfdf5" stroke="#10b981" stroke-width="1.5">
    <rect x="210" y="300" width="180" height="56" rx="6"/>
    <rect x="450" y="300" width="180" height="56" rx="6"/>
    <rect x="690" y="300" width="180" height="56" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="300" y="324" font-size="14" font-weight="600" fill="#064e3b">Appointments</text>
    <text x="300" y="343" font-size="12" fill="#047857">booking · idempotency</text>
    <text x="540" y="324" font-size="14" font-weight="600" fill="#064e3b">Availability</text>
    <text x="540" y="343" font-size="12" fill="#047857">bookable slots</text>
    <text x="780" y="324" font-size="14" font-weight="600" fill="#064e3b">Health</text>
    <text x="780" y="343" font-size="12" fill="#047857">liveness · readiness</text>
  </g>

  <!-- PostgreSQL. -->
  <path d="M180,452 V504 A360,14 0 0 0 900,504 V452" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <ellipse cx="540" cy="452" rx="360" ry="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="540" y="490" font-size="14" font-weight="600" fill="#7c2d12" text-anchor="middle">PostgreSQL 18</text>
  <text x="540" y="508" font-size="12" fill="#c2410c" text-anchor="middle">EXCLUDE constraints prevent double booking</text>
</svg>
